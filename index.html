  <h1>Methodology</h1>
  <p>This page is a draft. Sections marked <em>to do</em> are filled in when the test sets are frozen. Every number here is rebuilt from saved model transcripts by the code in the <a href="https://github.com/KurianJose7586/ost-in-translation-backend">backend repository</a>, where the first round's transcripts are published in <code>results/m0/</code>.</p>

  <h2>Data</h2>
  <p>Test clips come from the transcribed part of <a href="https://vaani.iisc.ac.in">Vaani</a>, which records where each speaker lives. The first round covers ten Hindi-speaking districts in seven states: 1,511 clips from 793 speakers, about 150 per district. No speaker gives more than 8 clips, and no speaker appears in two districts. Speaker IDs are hashed before anything is published, because some of Vaani's contain parts of names. The first round's clip list is <code>data/manifests/m0.jsonl</code> in the backend repository (SHA-256 <code style="word-break: break-all">555232c27bb717e63e01b2b53e9e3b4977aabfeee063f7032dbfdfa15ae56ba5</code>).</p>
  <p>Every clip is shorter than 40 seconds, because Omnilingual ASR rejects longer audio and every model must see the same clips. That leaves out the longest image descriptions.</p>
  <p>Vaani also publishes an official train, validation and test split, in a separate release that we found after the first round was drawn. The next round's test sets come from its test split, at most 4 clips per speaker: 28,370 clips in 30 languages and 149 districts, Hindi in 93 of them. 967 of the first round's clips are in the official training split, so the first round can never be used to evaluate a model trained on that split. <em>To do: the frozen manifest hashes.</em></p>

  <h2>Normalisation</h2>
  <p>Before scoring, the reference and the model's output both go through the same text normaliser, so spelling variants don't count as errors:</p>
  <ul>
    <li>Unicode NFC; zero-width joiners removed.</li>
    <li>The nukta is dropped (ज़ = ज), except in ड़ and ढ़.</li>
    <li>Chandrabindu becomes anusvara (माँ = मां), and so does a nasal with virama before a consonant of its own class (हिन्दी = हिंदी).</li>
    <li>Devanagari digits become ASCII digits; punctuation and symbols are removed; Latin script is lowercased.</li>
    <li>Vaani's annotations are removed: noise and pause tags, non-speech events such as [breathing], and the spelling Vaani adds in braces after a dialect or English word. Words spoken inside a noise tag are kept.</li>
  </ul>
  <p>The full rules and their test cases are in the <a href="https://github.com/KurianJose7586/ost-in-translation-backend">backend repository</a>. Two differences still count as errors: numbers a model writes in digits where Vaani writes words, and English words a model writes in Latin script where Vaani writes Devanagari. In the first round they made up under 3% of Whisper's errors and none of the other models'.</p>

  <h2>Scoring</h2>
  <p>A district's word error rate (WER) is all word errors (substitutions, deletions and insertions) divided by all reference words in that district. The 95% interval comes from a bootstrap that resamples speakers 1,000 times, because clips from one speaker aren't independent.</p>
  <p>Some districts were recorded in two languages, such as Hindi and Marathi in Pune. Each language is scored and mapped on its own: a Hindi and a Marathi error rate averaged together mean nothing, and a model may support only one of the two. Every model is scored on exactly the same clips; a clip a model couldn't read is left out for all of them.</p>
  <p>Map colours use a shrunk WER: each district is pulled toward its language's average, more strongly when its interval is wide, so a district with few clips can't swing the map. Tables show the raw WER. The example clips on each district's page are the ones nearest the district's median error rate.</p>
  <p><strong>Lenient WER</strong> scores the same clips again, but forgives differences that are spelling rather than hearing: the nasal mark (है and हैं, में and मे) and a short list of variants of the same word, such as बहोत and बहुत, or the homophones कि and की. In our first ten districts, about a third of the strongest model's errors were of this kind. If a district is bad on both measures, the model really is mishearing its speakers. Lenient WER also stops a model trained on Vaani from looking better just because it learned Vaani's spellings.</p>

  <h2>Models and languages</h2>
  <p>The first round compares three open models: Whisper-large-v3 (run with faster-whisper), Meta's Omnilingual ASR (omniASR_LLM_3B_v2) and AI4Bharat's IndicConformer (600M, multilingual).</p>
  <p>Each model is told the clip's language. Where a model doesn't know a variety (Bhojpuri, for example), it is told the closest language it does know, usually Hindi, because that is what a real user would choose. A model counts as supporting a variety only if it writes the script Vaani transcribes it in. Vaani writes Chakma, Garo, Mizo, Nagamese and Wancho in Latin script and Tulu in Kannada script, so Whisper is told Kannada for Tulu and Marathi for Konkani, and Omnilingual ASR is told Kannada for Tulu, since its own Tulu is in Malayalam script. Where a model supports no close language in the right script, as for Chakma, Garo and Wancho with all three models, the district is shown as <strong>not supported</strong>, never as a 100% error rate.</p>

  <h2>Contamination</h2>
  <p>A model trained on Vaani clips would look better here than it really is. Omnilingual ASR's paper describes its training data and doesn't name Vaani. OpenAI hasn't published Whisper's training data. IndicConformer's model card says only that it covers India's 22 official languages; no source we found lists Vaani among its training data, but none rules it out, and one of the companies that transcribed Vaani also worked on AI4Bharat's own corpus.</p>
  <p>Every first-round clip is also in Vaani's official split, so we compared each model on clips from its training split and on held-out clips. A model that trained on the training split would do better on those clips than the other models do. IndicConformer did about 10% better on training-split clips, against 5% for Omnilingual and 3% for Whisper. That difference is too small to be sure of, and IndicConformer still leads clearly on held-out clips alone (14.2% WER, against 19.2% and 26.4%). This check can't detect training on Vaani's main release, which holds clips from all three splits.</p>
  <p>Vaani-Benchmark-V1.0 can: it was published after IndicConformer, and none of its speakers is in either Vaani release. We ran all three models on its Hindi set, 5,050 segments from 102 districts. Scored the benchmark's own way, IndicConformer gets 13.2%, exactly its published number, which checks our whole pipeline. Every model does worse on the benchmark than on our first round, but IndicConformer loses a little more than Whisper: its ratio of benchmark to first-round WER is 1.07 times Whisper's (95% interval 1.02–1.12), or 1.06 (1.01–1.11) on the benchmark's Hindi-belt districts only, where our first round's districts are. That fits some Vaani in IndicConformer's training data. It is worth about one point of WER on our first round, and doesn't change who leads. Omnilingual ASR shows no such sign.</p>

  <h2>How much transcribers disagree</h2>
  <p>The benchmark has three independent transcriptions of every segment, so it shows how much people disagree about what was said. Two transcriptions differ from a third by 9–11% WER, which no model can meaningfully beat when scored against a single transcription. Districts where transcribers disagree more are a little harder for the models too: across the 102 districts, the rank correlation between how far transcription 2 is from transcription 3 and a model's WER is 0.23 for IndicConformer and 0.24 for Whisper.</p>

  <h2>Limitations</h2>
  <p>This is a first round: ten districts, one language, about 150 clips each. The reference transcripts haven't been checked by ear yet, so part of a district's error rate may come from how its clips were transcribed rather than from how its speakers talk. A listening audit of 30 clips per district comes next. The boundaries are Census 2011 districts; districts created since then are drawn inside their 2011 parent.</p>
  <p>A district's rank is only as stable as its sample. Splitting each district's speakers in two at random and comparing the rankings the halves give, the first round's ten districts rank consistently (split-half reliability 0.67–0.82, depending on the model). The benchmark's 102 districts, with about 50 segments each, rank much less consistently (0.45–0.49). Four of our districts are also in the benchmark, with other speakers and transcribers: Kabirdham stays the hardest of the four, but Rohtak, second-hardest in our first round, is one of the easier districts in the benchmark. So treat small differences between districts as noise until the next round's larger samples confirm them.</p>
